syntax = "proto3";
package logi.protocol.rs_shifter_handbrake;
import "logi/common_protocol/util.proto";
import "logi/protocol/banded_axis.proto";

message Settings {
  logi.protocol.util.RangeInt shift_sensitivity = 1;
  logi.protocol.util.RangeInt handbrake_actuation = 2;
  logi.protocol.util.RangeInt handbrake_sensitivity = 3;
  uint32 flags = 4;
  string handbrake_sensitivity_preset = 5;
}
message Mode {
  enum Type {
    INVALID = 0;
    SHIFTER = 1;
    HANDBRAKE = 2;
    DIGITAL_HANDBRAKE = 3;
  }
  uint32 id = 1;
  logi.protocol.rs_shifter_handbrake.Mode.Type type = 2;
}
message Capabilities {
  repeated logi.protocol.rs_shifter_handbrake.Mode modes = 1;
  repeated logi.protocol.banded_axis.BandInfo bands = 2;
}
