syntax = "proto3";
package logi.protocol.triggers;
import "logi/protocol/devices.proto";
import "logi/protocol/inputs.proto";
import "logi/protocol/macros.proto";
import "logi/protocol/slots.proto";

message Trigger {
  message Event {
    string device_id = 1;
    logi.protocol.devices.Device.Type device_type = 2;
    logi.protocol.slots.Slot slot = 3;
    logi.protocol.inputs.Input input = 4;
  }
  message Context {
    message List {
      repeated string id_list = 1;
    }
    message Transfer {
      string from = 1;
      string to = 2;
    }
    string slot_id = 1;
    string device_id = 2;
    logi.protocol.devices.Device.Type device_type = 3;
    logi.protocol.triggers.MacroPlayback macro_playback = 4;
  }
}
message MacroPlayback {
  enum Operation {
    INVALID_OPERATION = 0;
    START = 1;
    STOP = 2;
    START_THEN_STOP = 3;
  }
  string macro_id = 1;
  logi.protocol.macros.PlaybackParameters params = 2;
  logi.protocol.triggers.MacroPlayback.Operation operation = 3;
  string target_device = 4;
  string trigger_id = 5;
  logi.protocol.devices.Device.Info.Basic device_info = 10;
}
message MacroAction {
  logi.protocol.triggers.Trigger.Event trigger = 1;
  logi.protocol.macros.Macro macro = 2;
}
message MREvent {
  logi.protocol.inputs.Input.Event input_event = 1;
  bool is_active = 2;
}
