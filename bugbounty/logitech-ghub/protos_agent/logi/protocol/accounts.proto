syntax = "proto3";
package logi.protocol.accounts;
import "logi/common_protocol/message.proto";
import "logi/protocol/cloud.proto";

enum AudienceType {
  INVALID = 0;
  GHUB_COMMUNITY = 1;
  LGDB = 2;
}
message LogiAccount {
  string id = 1;
  string email = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
  bool email_verified = 6;
  string access_token_expires_in = 7;
  string access_token = 8;
  logi.protocol.accounts.AudienceType audience = 9;
}
message UserInfoUpdated {
  enum AccountsEventType {
    LOGIN = 0;
    LOGOUT = 1;
    REFRESH = 2;
  }
  logi.protocol.accounts.UserInfoUpdated.AccountsEventType type = 1;
  logi.protocol.Result.Code result = 2;
  logi.protocol.accounts.AudienceType audience = 3;
}
message AccountsRequest {
  logi.protocol.accounts.AudienceType audience = 1;
}
message IdentityToken {
  string id_token = 1;
  string access_token = 2;
}
message LogidPkceServerRequest {
  string url = 1;
}
message LogidPkceServerResponse {
  string code = 1;
  string language = 2;
  string state = 3;
  string redirect_uri = 4;
}
message Config {
  string device_recommendation_url = 1;
  string region = 2;
  string marketplace_url = 3;
}
message Audiences {
  repeated logi.protocol.accounts.AudienceType audiences = 1;
}
message LogoutRequest {
  string redirect_to = 1;
}
message CnIdaasStatus {
  bool enabled = 1;
  string env = 2;
}
