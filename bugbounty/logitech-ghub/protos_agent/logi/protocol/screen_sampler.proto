syntax = "proto3";
package logi.protocol.screen_sampler;

message Function {
  enum Type {
    INVALID_TYPE = 0;
    AVERAGE_COLOR = 1;
  }
}
message Region {
  string name = 1;
  string id = 2;
  float top = 3;
  float right = 4;
  float bottom = 5;
  float left = 6;
  logi.protocol.screen_sampler.Function.Type color_function = 7;
  bool read_only = 8;
  string order = 9;
}
message Regions {
  map<string, logi.protocol.screen_sampler.Region> region_map = 1;
}
