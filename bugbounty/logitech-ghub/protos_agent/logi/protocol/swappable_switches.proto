syntax = "proto3";
package logi.protocol.swappable_switches;

message Capabilities {
  bool supports_swappable_switches = 1;
  repeated logi.protocol.swappable_switches.SwappableSwitches.SwitchType supported_switch_types = 2;
}
message SwappableSwitches {
  enum SwitchType {
    UNKNOWN_TYPE = 0;
    ANALOG_POSITIVE_POLARITY = 1;
    ANALOG_NEGATIVE_POLARITY = 2;
    ANALOG_GENERIC = 4;
    GALVANIC = 8;
    ANALOG_ANY = 7;
  }
  message SwitchTypeValue {
    logi.protocol.swappable_switches.SwappableSwitches.SwitchType value = 1;
  }
  message SwitchTypeList {
    repeated logi.protocol.swappable_switches.SwappableSwitches.SwitchType list = 1;
  }
  message SwitchSupportAndStateTable {
    repeated logi.protocol.swappable_switches.SwappableSwitches.SwitchType switch_types = 1;
    map<uint32, bool> cid_map = 2;
  }
  message SwitchSupportAndStateTables {
    map<uint32, logi.protocol.swappable_switches.SwappableSwitches.SwitchSupportAndStateTable> tables = 1;
  }
}
