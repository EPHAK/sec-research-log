syntax = "proto3";
package logi.protocol.system_tray;
import "logi/protocol/devices.proto";
import "logi/common_protocol/util.proto";
import "logi/protocol/input_preset.proto";
import "logi/protocol/report_rates.proto";

message Status {
  message Text {
    string text = 1;
  }
  message Connection {
    logi.protocol.devices.Device.DisplayConnection connection_type = 1;
  }
  message Battery {
    int32 percentage = 1;
    bool is_charging = 2;
    string label = 3;
  }
  message Icon {
    enum Type {
      Info = 0;
      Warning = 1;
      Error = 2;
    }
    string text = 1;
    string tooltip_text = 2;
    logi.protocol.system_tray.Status.Icon.Type icon_type = 3;
  }
  message FKC {
    bool fkc_enabled = 1;
  }
  message ReportRate {
    uint32 report_rate = 1;
  }
  message AnalogConflict {
    string text = 1;
  }
  string id = 1;
  logi.protocol.system_tray.Status.Text text = 10;
  logi.protocol.system_tray.Status.Connection connection = 11;
  logi.protocol.system_tray.Status.Battery battery = 12;
  logi.protocol.system_tray.Status.Icon icon = 13;
  logi.protocol.system_tray.Status.FKC fkc = 14;
  logi.protocol.system_tray.Status.ReportRate report_rate = 15;
  logi.protocol.system_tray.Status.AnalogConflict analog_conflict = 16;
}
message Control {
  enum Alignment {
    DEFAULT_ALIGNMENT = 0;
    LEFT = 1;
    CENTER = 2;
    RIGHT = 3;
  }
  message Update {
    string id = 1;
    int32 int_value = 10;
    string string_value = 11;
    bool bool_value = 12;
  }
  message QueuedUpdate {
    map<string, logi.protocol.system_tray.Control.Update> updates = 1;
  }
  message Button {
    string text = 1;
  }
  message Label {
    string text = 1;
  }
  message Separator {
  }
  message Slider {
    uint32 min = 1;
    uint32 max = 2;
    uint32 value = 3;
    uint32 step = 4;
    uint32 steps = 5;
    string unit = 6;
    string text = 7;
    uint32 min_limit = 8;
    uint32 max_limit = 9;
    bool reverse_direction = 10;
    int32 refresh_rate = 11;
  }
  message Toggle {
    string text = 1;
    bool value = 2;
    string on_text = 3;
    string off_text = 4;
  }
  message List {
    message Entry {
      string display_text = 1;
      string value = 2;
      string color = 3;
    }
    string text = 10;
    string selected_value = 11;
    repeated logi.protocol.system_tray.Control.List.Entry entries = 12;
  }
  message AudioMixer {
    uint32 value = 1;
    string text = 2;
    int32 refresh_rate = 3;
  }
  message AudioBalanceMixer {
    string text = 1;
    string left_source = 2;
    string right_source = 3;
    logi.protocol.util.RangeInt range = 4;
    int32 refresh_rate = 5;
  }
  message AudioMatrixMixer {
    message Mixer {
      string id = 1;
      logi.protocol.util.RangeInt range = 2;
      int32 refresh_rate = 3;
    }
    message Mute {
      string id = 1;
      bool value = 2;
    }
    string text = 1;
    logi.protocol.system_tray.Control.AudioMatrixMixer.Mixer mixer = 2;
    logi.protocol.system_tray.Control.AudioMatrixMixer.Mute mute = 3;
  }
  message LaunchGameButton {
    string text = 1;
    string image_path = 2;
    string launch_args = 3;
  }
  message NavigationButton {
    uint32 string_id = 1;
    string image_name = 2;
  }
  string id = 1;
  bool enabled = 2;
  logi.protocol.system_tray.Control.Alignment alignment = 3;
  repeated logi.protocol.system_tray.Status statuses = 4;
  logi.protocol.system_tray.Control.Button button = 10;
  logi.protocol.system_tray.Control.Label label = 11;
  logi.protocol.system_tray.Control.Separator separator = 12;
  logi.protocol.system_tray.Control.Slider slider = 13;
  logi.protocol.system_tray.Control.Toggle toggle = 14;
  logi.protocol.system_tray.Control.List list = 15;
  logi.protocol.system_tray.Control.AudioMixer audio_mixer = 16;
  logi.protocol.system_tray.Control.AudioBalanceMixer audio_balance_mixer = 17;
  logi.protocol.system_tray.Control.AudioMatrixMixer audio_matrix_mixer = 18;
  logi.protocol.system_tray.Control.LaunchGameButton launch_game_button = 19;
  logi.protocol.system_tray.Control.NavigationButton navigation_button = 20;
}
message MismatchDpiNotification {
  string action_str = 1;
  uint32 dpi_value = 2;
}
message SystemTray {
  message Device {
    string device_id = 1;
    string display_name = 2;
    logi.protocol.system_tray.Control header_control = 3;
    repeated logi.protocol.system_tray.Status statuses = 4;
    repeated logi.protocol.system_tray.Control controls = 5;
  }
  message Updates {
    repeated logi.protocol.system_tray.Status statuses = 1;
    repeated logi.protocol.system_tray.Control controls = 2;
  }
  string title = 1;
  string language = 2;
  bool sentry_opt_in = 3;
  repeated logi.protocol.system_tray.SystemTray.Device devices = 4;
  bool gl_enabled = 5;
  bool gl_tab_visible = 6;
  repeated logi.protocol.system_tray.Control launched_games = 7;
  repeated logi.protocol.system_tray.Control navigation_items = 8;
}
message Notification {
  string title = 1;
  string message = 2;
  logi.protocol.util.Time timeout = 3;
}
