syntax = "proto3";
package logi.protocol.pedals;
import "logi/common_protocol/util.proto";

message PedalSettings {
  logi.protocol.util.RangeInt accelerator_sensitivity = 1;
  logi.protocol.util.RangeInt brake_sensitivity = 2;
  logi.protocol.util.RangeInt clutch_sensitivity = 3;
  bool use_combined_axes = 4;
  logi.protocol.util.RangeInt brake_force = 5;
  uint32 flags = 6;
  string accelerator_sensitivity_preset = 7;
  string brake_sensitivity_preset = 8;
  string clutch_sensitivity_preset = 9;
}
message PortInfo {
  enum PortType {
    INVALID = 0;
    ACCELERATOR = 1;
    LOAD_CELL_BRAKE = 2;
    CLUTCH = 3;
    HALL_SENSOR_BRAKE = 4;
  }
  enum PortStatus {
    CONNECTED_AND_WORKING = 0;
    EMPTY = 1;
    ERROR_WRONG_PEDAL_CONNECTED = 2;
    CONNECTED_WITH_ERROR = 3;
  }
  logi.protocol.pedals.PortInfo.PortType type = 1;
  logi.protocol.pedals.PortInfo.PortStatus status = 2;
}
message PedalsStatus {
  repeated logi.protocol.pedals.PortInfo port_info = 1;
}
message BrakeForce {
  uint32 current_kg_load = 1;
  uint32 max_kg_load = 2;
}
