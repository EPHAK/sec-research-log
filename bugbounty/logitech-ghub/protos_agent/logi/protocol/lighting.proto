syntax = "proto3";
package logi.protocol.lighting;
import "logi/protocol/firmware_lighting.proto";
import "logi/protocol/software_lighting.proto";

message CardSettings {
  message Brightness {
    uint32 value = 1;
    bool is_off = 2;
  }
  repeated logi.protocol.firmware_lighting.Effect firmware_effects = 1;
  repeated logi.protocol.software_lighting.Effect.Metadata.Interface software_effects = 2;
  logi.protocol.lighting.CardSettings.Brightness brightness = 3;
}
