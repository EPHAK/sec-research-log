syntax = "proto3";
package logi.protocol.axis_monitor;
import "logi/protocol/axis.proto";
import "logi/common_protocol/util.proto";

message SupportedAxes {
  repeated logi.protocol.axis.Info axes = 1;
}
message Monitor {
  logi.protocol.axis.Id id = 1;
  bool monitoring = 2;
}
message List {
  message Details {
    logi.protocol.axis.Id axis_id = 1;
    bool monitoring = 2;
    uint32 minimum = 3;
    uint32 maximum = 4;
    uint32 resolution = 5;
  }
  repeated logi.protocol.axis_monitor.List.Details axes = 1;
}
message PackedMonitor {
  repeated logi.protocol.axis_monitor.Monitor monitors = 1;
}
message AnalyticsEvent {
  string device_id = 1;
  string app_path = 2;
  bool in_use = 3;
}
message Event {
  message Status {
    string device_id = 1;
    logi.protocol.axis.Id axis_id = 2;
    logi.protocol.util.RangeInt value = 3;
    bool monitoring = 4;
  }
  repeated logi.protocol.axis_monitor.Event.Status axes = 1;
}
