syntax = "proto3";
package logi.protocol.application;
import "logi/common_protocol/settings.proto";

message Configuration {
  bool autolaunch = 1;
  string language = 2;
  bool onboarding_shown = 3;
  bool migration_shown = 4;
  repeated string seen_coach_marks = 5;
  bool blue_voice_advanced_controls_enabled = 6;
  string brand = 7;
  bool notifications_enabled = 8;
  bool settings_loaded_from_backup = 9;
  repeated logi.protocol.settings.KeyValue key_value = 10;
  bool low_battery_notifications_enabled = 11;
  bool lock_notifications_enabled = 12;
  repeated string nonInteractivePrompted = 13;
  bool mouse_buttons_swapped = 14;
  string home_layout = 15;
  bool webcam_in_use = 16;
  bool marketing_emails_optin_shown = 17;
  bool profile_setup_popup_shown = 18;
  bool device_recommendation = 19;
  string country_or_region = 20;
  string dismissed_device_recommendation_id = 21;
  bool gl_enabled = 22;
  bool gl_visible = 23;
  bool gl_feature_introduction_dot_shown = 24;
  string game_apps_updater_cdn_url = 25;
  bool gl_tab_visible = 26;
}
message FeatureFlags {
  map<string, bool> features = 1;
}
message OnlineFeatureFlags {
  map<string, bool> flags = 1;
}
message MacPermissions {
  enum Status {
    UNKNOWN = 0;
    AUTHORIZED = 1;
    NEEDS_AUTHORIZATION = 2;
    WAIT_FOR_OS = 3;
  }
  logi.protocol.application.MacPermissions.Status status = 1;
}
