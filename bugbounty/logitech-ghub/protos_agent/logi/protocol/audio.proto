}
message Acoustics {
  logi.protocol.audio.SurroundSound surround = 1;
  logi.protocol.audio.AutomaticNoiseReduction automatic_noise_reduction = 2;
  logi.protocol.audio.Volume sidetone = 3;
  logi.protocol.audio.Volume subwoofer_bass_level = 4;
}
message AutomaticNoiseReduction {
  bool enabled = 1;
}
message Logivoice {
  enum State {
    INVALID_STATE = 0;
    DISABLED = 1;
    ENABLED = 2;
  }
  message MasterEnable {
    logi.protocol.audio.Logivoice.State state = 1;
  }
  message NoiseReduction {
    logi.protocol.audio.Logivoice.State state = 1;
    uint32 sensitivity = 2;
    uint32 release = 3;
    uint32 bias = 4;
    int32 attenuation = 5;
  }
  message NoiseGate {
    logi.protocol.audio.Logivoice.State state = 1;
    int32 threshold = 2;
    int32 attenuation = 3;
    uint32 attack = 4;
    uint32 hold = 5;
    uint32 release = 6;
  }
  message Compressor {
    logi.protocol.audio.Logivoice.State state = 1;
    int32 threshold = 2;
    uint32 attack = 3;
    uint32 release = 4;
    int32 post_gain = 5;
    int32 pre_gain = 6;
    uint32 ratio = 7;
  }
  message BandReduction {
    logi.protocol.audio.Logivoice.State state = 1;
    int32 threshold = 2;
    uint32 frequency = 3;
    float width_q = 4;
    uint32 attack = 5;
    uint32 release = 6;
    int32 attenuation = 7;
  }
  message Limiter {
    logi.protocol.audio.Logivoice.State state = 1;
    int32 boost = 2;
    uint32 attack = 3;
    uint32 release = 4;
  }
  message HighPassFilter {
    logi.protocol.audio.Logivoice.State state = 1;
    uint32 frequency = 2;
  }
  message Blocks {
    message Block {
      enum Type {
        INVALID_BLOCK_TYPE = 0;
        MAX_OUT_LEVEL = 1;
        MIC_EQ = 2;
        HIGH_PASS_FILTER = 3;
        LIMITER = 4;
        DEPOPPER = 5;
        DEESSER = 6;
        COMPRESSOR = 7;
        NOISE_GATE = 8;
        NOISE_REDUCTION = 9;
        AI_DENOISER = 10;
      }
      logi.protocol.audio.Logivoice.Blocks.Block.Type type = 1;
      int32 feature_id = 2;
    }
    repeated logi.protocol.audio.Logivoice.Blocks.Block blocks = 1;
  }
  message Parameters {
    logi.protocol.audio.Logivoice.NoiseReduction noise_reduction = 1;
    logi.protocol.audio.Logivoice.NoiseGate noise_gate = 2;
    logi.protocol.audio.Logivoice.Compressor compressor = 3;
    logi.protocol.audio.Logivoice.BandReduction deesser = 4;
    logi.protocol.audio.Logivoice.BandReduction depopper = 5;
    logi.protocol.audio.Logivoice.Limiter limiter = 6;
    logi.protocol.audio.Logivoice.HighPassFilter hpf = 7;
    logi.protocol.audio.UnifiedEqualizer eq = 8;
    logi.protocol.audio.AiNoiseReduction ai_nr = 9;
  }
  message Information {
    logi.protocol.audio.Logivoice.Blocks configuration = 1;
    logi.protocol.audio.Logivoice.NoiseReduction min_noise_reduction = 2;
    logi.protocol.audio.Logivoice.NoiseReduction max_noise_reduction = 3;
    logi.protocol.audio.Logivoice.NoiseGate min_noise_gate = 4;
    logi.protocol.audio.Logivoice.NoiseGate max_noise_gate = 5;
    logi.protocol.audio.Logivoice.Compressor min_compressor = 6;
    logi.protocol.audio.Logivoice.Compressor max_compressor = 7;
    logi.protocol.audio.Logivoice.BandReduction min_deesser = 8;
    logi.protocol.audio.Logivoice.BandReduction max_deesser = 9;
    logi.protocol.audio.Logivoice.BandReduction min_depopper = 10;
    logi.protocol.audio.Logivoice.BandReduction max_depopper = 11;
    logi.protocol.audio.Logivoice.Limiter min_limiter = 12;
    logi.protocol.audio.Logivoice.Limiter max_limiter = 13;
    logi.protocol.audio.Logivoice.HighPassFilter min_hpf = 14;
    logi.protocol.audio.Logivoice.HighPassFilter max_hpf = 15;
    logi.protocol.audio.UnifiedEqualizer.Information eq = 16;
  }
}
message UnifiedEqualizer {
  enum EqualizerType {
    INVALID_EQUALIZER_TYPE = 0;
    STANDARD = 1;
    PRO = 2;
    CENTURION = 3;
    CENTURION_PRO = 4;
    CENTURION_ADVANCED_PARAMETRIC = 5;
  }
  message Configuration {
    map<int32, string> active_card_ids = 1;
  }
  message Capabilities {
    logi.protocol.audio.UnifiedEqualizer.EqualizerType type = 1;
    map<int32, string> instance_names = 2;
    bool fetch_default_presets_from_device = 3;
    repeated uint32 unsupported_instances = 4;
  }
  message Information {
    message CenturionAdvancedParametric {
      enum AudioPath {
        INVALID_AUDIOPATH = 0;
        HEADSET_MIC = 1;
        GAME_IN = 2;
        VOICE_IN = 4;
        STREAM_OUT = 8;
        BT_IN = 16;
      }
      message Instance {
        enum Format {
          INVALID_FORMAT = 0;
          CLASSIC = 1;
          STYLES = 2;
        }
        repeated logi.protocol.audio.UnifiedEqualizer.Information.CenturionAdvancedParametric.AudioPath audio_paths = 1;
        int32 band_count = 2;
        float gain_min = 3;
        float gain_max = 4;
        int32 gain_steps = 5;
        int32 onboard_readonly_preset_count = 8;
        int32 onboard_custom_preset_count = 9;
        bool supports_xy = 10;
        logi.protocol.audio.UnifiedEqualizer.Information.CenturionAdvancedParametric.Instance.Format format = 11;
      }
      repeated logi.protocol.audio.UnifiedEqualizer.Information.CenturionAdvancedParametric.Instance instances = 1;
    }
    logi.protocol.audio.UnifiedEqualizer.EqualizerType type = 1;
    logi.protocol.audio.UnifiedEqualizer.Information.CenturionAdvancedParametric centurion_advanced_parametric = 10;
  }
  message Parameter {
    enum ParameterType {
      INVALID_PARAMETER_TYPE = 0;
      GAINS = 1;
      FREQUENCIES = 2;
      Q_FACTORS = 3;
      ONBOARD_INDEX = 4;
      PRE_EQ_GAIN = 5;
      XY_POSITION = 6;
    }
    logi.protocol.audio.UnifiedEqualizer.Parameter.ParameterType type = 1;
    repeated float data = 2;
  }
  message Setting {
    enum DisplayType {
      INVALID_DISPLAY_TYPE = 0;
      SIMPLE_2_BANDS = 1;
      ADVANCED_10_BANDS = 2;
      PRO_5_BANDS = 3;
      PARAMETRIC = 4;
      PARAMETRIC_FACTORY = 5;
      GRAPHICAL = 6;
      GRAPHICAL_FACTORY = 7;
      XY = 8;
      XY_FACTORY = 9;
    }
    logi.protocol.audio.UnifiedEqualizer.Setting.DisplayType display_type = 1;
    repeated logi.protocol.audio.UnifiedEqualizer.Parameter parameters = 2;
  }
  logi.protocol.audio.UnifiedEqualizer.EqualizerType type = 1;
  int32 instance = 2;
  int32 active_setting_index = 3;
  repeated logi.protocol.audio.UnifiedEqualizer.Setting settings = 4;
}
message Equalizer {
