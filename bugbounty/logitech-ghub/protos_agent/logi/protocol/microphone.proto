syntax = "proto3";
package logi.protocol.microphone;

message Settings {
  bool blue_voice_enabled = 1;
  bool blue_voice_2_enabled = 2;
  bool logi_voice_enabled = 3;
  logi.protocol.microphone.PolarPattern.Support polar_pattern = 4;
  logi.protocol.microphone.MicrophoneGain microphone_gain = 5;
  bool automatic_gain_control = 6;
}
message MicrophoneGain {
  float gain = 1;
}
message VoiceEQ {
  message Band {
    float frequency = 1;
    float gain = 2;
    float width = 3;
  }
  bool enabled = 1;
  logi.protocol.microphone.VoiceEQ.Band low = 2;
  logi.protocol.microphone.VoiceEQ.Band mid = 3;
  logi.protocol.microphone.VoiceEQ.Band high = 4;
}
message DePopper {
  bool enabled = 1;
  float frequency = 2;
}
message NoiseReduction {
  bool enabled = 1;
  float release = 2;
  float sensitivity = 3;
  float bias = 4;
  float attenuation_max = 5;
}
message Expander {
  bool enabled = 1;
  float attack = 2;
  float release = 3;
  float hysteresis = 4;
  float ratio = 5;
  float threshold = 6;
  bool threshold_auto_enabled = 7;
  float threshold_auto_sensibility = 8;
  float attenuation_max = 9;
}
message DeEsser {
  bool enabled = 1;
  float attack = 2;
  float release = 3;
  float ratio = 4;
  float threshold = 5;
  float frequency = 6;
}
message Compressor {
  bool enabled = 1;
  float attack = 2;
  float release = 3;
  float ratio = 4;
  float threshold = 5;
  float makeup = 6;
}
message Limiter {
  float boost = 1;
  float attack = 2;
  float release = 3;
}
message BlueVoice {
  message Description {
    string name = 1;
    string source_id = 2;
    string tag = 3;
    string slot_prefix = 4;
  }
  message Settings {
    float balance = 1;
    float volume = 2;
    logi.protocol.microphone.VoiceEQ voice_eq = 3;
    logi.protocol.microphone.DePopper de_popper = 4;
    logi.protocol.microphone.NoiseReduction noise_reduction = 5;
    logi.protocol.microphone.Expander expander = 6;
    logi.protocol.microphone.DeEsser de_esser = 7;
    logi.protocol.microphone.Compressor compressor = 8;
    logi.protocol.microphone.Limiter limiter = 9;
    float input_gain = 10;
    string input_gain_card_id = 11;
  }
  message Update {
    string endpoint_id = 1;
    bool enabled = 2;
    logi.protocol.microphone.BlueVoice.Settings settings = 3;
  }
  logi.protocol.microphone.BlueVoice.Description description = 1;
  logi.protocol.microphone.BlueVoice.Settings settings = 2;
}
message EndpointDescription {
  string name = 1;
  string source_id = 2;
  string tag = 3;
  string slot_prefix = 4;
}
message BlueVoice2 {
  message HighPassFilter {
    bool enabled = 1;
    float frequency = 2;
  }
  message NoiseReduction {
    bool enabled = 1;
    float sensitivity = 2;
    float bias = 3;
    float max_attenuation = 4;
    float release = 5;
  }
  message GatingCompressor {
    bool noise_gate_enabled = 1;
    float noise_gate_threshold = 2;
    float noise_gate_max_attenuation = 3;
    float noise_gate_attack = 4;
    float noise_gate_release = 5;
    float noise_gate_hold_time = 6;
    bool compressor_enabled = 7;
    float compressor_threshold = 8;
    float compressor_ratio = 9;
    float compressor_pre_gain = 10;
    float compressor_post_gain = 11;
    float compressor_attack = 12;
    float compressor_release = 13;
  }
  message MultiBandEQ {
    message Filter {
      float frequency = 1;
      float gain = 2;
      float q = 3;
    }
    bool enabled = 1;
    logi.protocol.microphone.BlueVoice2.MultiBandEQ.Filter low_band_filter = 2;
    logi.protocol.microphone.BlueVoice2.MultiBandEQ.Filter mid_band_filter = 3;
    logi.protocol.microphone.BlueVoice2.MultiBandEQ.Filter high_band_filter = 4;
  }
  message Compressor {
    bool enabled = 1;
    float frequency = 2;
    float width = 3;
    float max_attenuation = 4;
    float attack = 5;
    float release = 6;
    float threshold = 7;
  }
  message HardLimiter {
    bool enabled = 1;
    float attack = 2;
    float release = 3;
    float boost = 4;
  }
  message Settings {
    float volume = 1;
    logi.protocol.microphone.BlueVoice2.NoiseReduction noise_reduction = 2;
    logi.protocol.microphone.BlueVoice2.GatingCompressor gating_compressor = 3;
    logi.protocol.microphone.BlueVoice2.HighPassFilter high_pass_filter = 4;
    logi.protocol.microphone.BlueVoice2.MultiBandEQ multi_band_eq = 5;
    logi.protocol.microphone.BlueVoice2.Compressor de_popper = 6;
    logi.protocol.microphone.BlueVoice2.Compressor de_esser = 7;
    logi.protocol.microphone.BlueVoice2.HardLimiter hard_limiter = 8;
    float input_gain = 9;
    string input_gain_card_id = 10;
    bool automatic_gain_control = 11;
    string automatic_gain_control_card_id = 12;
    bool has_automatic_gain_control = 13;
  }
  message Update {
    string endpoint_id = 1;
    bool enabled = 2;
    logi.protocol.microphone.BlueVoice2.Settings settings = 3;
  }
  logi.protocol.microphone.EndpointDescription description = 1;
  logi.protocol.microphone.BlueVoice2.Settings settings = 2;
}
message Effects {
  message VocalChanger {
    enum VocalMode {
      VOCAL_MODE_OFF = 0;
      VOCAL_MODE_FORMANT_WARP = 1;
      VOCAL_MODE_PITCH_SHIFT = 2;
      VOCAL_MODE_FORMANT_SHIFT = 3;
      VOCAL_MODE_ROBOT = 4;
      VOCAL_MODE_WHISPEZ = 5;
      VOCAL_MODE_NOICE = 6;
      VOCAL_MODE_GROWL = 7;
      VOCAL_MODE_AIR = 8;
      VOCAL_MODE_ETHER = 9;
      VOCAL_MODE_HOUSEOTRON = 10;
      VOCAL_MODE_FUNKBOT = 11;
      VOCAL_MODE_TALKBOX = 12;
      VOCAL_MODE_SUBBY = 13;
      VOCAL_MODE_NO_TREBLE = 14;
    }
    logi.protocol.microphone.Effects.VocalChanger.VocalMode vocal_mode_1 = 1;
    float voice_mod_factor_1 = 2;
    logi.protocol.microphone.Effects.VocalChanger.VocalMode vocal_mode_2 = 3;
    float voice_mod_factor_2 = 4;
    float voice_gain_1 = 5;
    float voice_gain_2 = 6;
    bool chorus_enabled = 7;
    float chorus_delay = 8;
    float chorus_delay_mod = 9;
    float chorus_delay_mod_rate = 10;
    float chorus_pitch_mod = 11;
    float chorus_pitch_mod_rate = 12;
  }
  message FlangerPhaser {
    enum PhaserMode {
      PHASER_MODE_FLANGER_UP = 0;
      PHASER_MODE_FLANGER_DOWN = 1;
      PHASER_MODE_FLANGER_OSCILLATE = 2;
      PHASER_MODE_PHASER_STUN = 3;
      PHASER_MODE_PHASER_HEAVY = 4;
      PHASER_MODE_PHASER_KILL = 5;
    }
    bool enabled = 1;
    logi.protocol.microphone.Effects.FlangerPhaser.PhaserMode phaser_mode = 2;
    float depth = 3;
    float rate = 4;
  }
  message RingModulation {
    enum ShapeMode {
      SHAPE_MODE_SINE = 0;
      SHAPE_MODE_TRIANGLE = 1;
      SHAPE_MODE_SAW_TOOTH = 2;
      SHAPE_MODE_SQUARE = 3;
      SHAPE_MODE_HALFWAVERECTIFIER = 4;
    }
    bool enabled = 1;
    float mix = 2;
    logi.protocol.microphone.Effects.RingModulation.ShapeMode shape_mode = 3;
    float carrier_frequency = 4;
  }
  message Reverb {
    enum ReflectionMode {
      REFLECTION_MODE_NONE = 0;
      REFLECTION_MODE_TIGHT = 1;
      REFLECTION_MODE_MIDMIX = 2;
      REFLECTION_MODE_LARGEDIFF = 3;
      REFLECTION_MODE_ECHO = 4;
      REFLECTION_MODE_ECHO2 = 5;
      REFLECTION_MODE_ECHO3 = 6;
      REFLECTION_MODE_FLUTTER = 7;
      REFLECTION_MODE_ST_FLUTTER = 8;
      REFLECTION_MODE_ECHO_FLUTTER = 9;
    }
    bool enabled = 1;
    float early_late_mix = 2;
    logi.protocol.microphone.Effects.Reverb.ReflectionMode reflection_mode = 3;
    float reflection_low_pass_frequency = 4;
    float room_size = 5;
    float mix = 6;
  }
  message Delay {
    enum FeedbackMode {
      FEEDBACK_MODE_NORMAL = 0;
      FEEDBACK_MODE_CROSSED = 1;
    }
    enum FeedbackTimbre {
      FEEDBACK_TIMBRE_FULL = 0;
      FEEDBACK_TIMBRE_DARK = 1;
      FEEDBACK_TIMBRE_BRIGHT = 2;
    }
    enum InputMode {
      INPUT_MODE_NORMAL = 0;
      INPUT_MODE_CROSSED = 1;
      INPUT_MODE_LEFT = 2;
      INPUT_MODE_RIGHT = 3;
    }
    bool enabled = 1;
    logi.protocol.microphone.Effects.Delay.InputMode input_mode = 2;
    logi.protocol.microphone.Effects.Delay.FeedbackMode feedback_mode = 3;
    logi.protocol.microphone.Effects.Delay.FeedbackTimbre feedback_timbre = 4;
    float left_delay = 5;
    float right_delay = 6;
    float feedback = 7;
    float mix = 8;
  }
  message Settings {
    logi.protocol.microphone.Effects.VocalChanger vocal_changer = 1;
    logi.protocol.microphone.Effects.FlangerPhaser flanger_phaser = 2;
    logi.protocol.microphone.Effects.RingModulation ring_modulation = 3;
    logi.protocol.microphone.Effects.Reverb reverb = 4;
    logi.protocol.microphone.Effects.Delay delay = 5;
  }
  message Update {
    string endpoint_id = 1;
    logi.protocol.microphone.Effects.Settings settings = 2;
  }
  logi.protocol.microphone.EndpointDescription description = 1;
  logi.protocol.microphone.Effects.Settings settings = 2;
}
message PlaybackInfo {
  enum Result {
    SUCCESS = 0;
    FAILED = 1;
    INVALID_FILE = 2;
    EMPTY_FILE = 3;
  }
  logi.protocol.microphone.PlaybackInfo.Result state = 1;
}
message RecordPlayback {
  enum Action {
    UNKNOWN_ACTION = 0;
    RECORD = 1;
    STOP_RECORDING = 2;
    PLAYBACK = 3;
    STOP_PLAYBACK = 4;
    STOP = 5;
    LOAD = 6;
  }
  enum State {
    UNKNOWN_STATE = 0;
    RECORDING = 1;
    STOPPED = 2;
    PLAYING = 3;
  }
  logi.protocol.microphone.RecordPlayback.Action action = 1;
  logi.protocol.microphone.RecordPlayback.State state = 2;
  float length = 3;
  float offset = 4;
  string path = 5;
  bool sampler_mode = 6;
  logi.protocol.microphone.PlaybackInfo.Result result = 7;
}
message MicrophoneSettings {
  logi.protocol.microphone.PolarPattern.Support polar_pattern = 1;
}
message PolarPattern {
  enum Type {
    INVALID = 0;
    POLAR_PATTERN_STEREO = 1;
    POLAR_PATTERN_CARDIOID = 2;
    POLAR_PATTERN_BIDIRECTIONAL = 3;
    POLAR_PATTERN_OMNI = 4;
    POLAR_PATTERN_CUSTOM = 5;
    POLAR_PATTERN_HYPERCARDIOID = 6;
    POLAR_PATTERN_SUPERCARDIOID = 7;
    POLAR_PATTERN_AUTOMATIC = 8;
  }
  message View {
    float db_at_min = 1;
    float db_at_max = 2;
    uint32 max_magnitude = 3;
    repeated uint32 vector_magnitudes = 4;
    uint32 direction_index = 5;
  }
  message Support {
    logi.protocol.microphone.PolarPattern.Type id = 1;
  }
  message Info {
    int32 min_value = 1;
    int32 max_value = 2;
    int32 min_direction = 3;
    int32 max_direction = 4;
  }
  message Data {
    logi.protocol.microphone.PolarPattern.Type type = 1;
    int32 value = 2;
    int32 direction = 3;
    logi.protocol.microphone.PolarPattern.View view = 4;
  }
  map<uint32, logi.protocol.microphone.PolarPattern.Data> data = 1;
  logi.protocol.microphone.PolarPattern.Type active_pattern = 2;
}
message MicMode {
  enum Type {
    UNKNOWN = 0;
    MICROPHONE_GAIN = 1;
    HEADPHONE_LEVEL = 2;
    BLEND = 3;
  }
  message Support {
    logi.protocol.microphone.MicMode.Type id = 1;
  }
}
message Device {
  logi.protocol.microphone.PolarPattern.Support polar_pattern = 1;
  logi.protocol.microphone.MicMode.Support mic_mode = 2;
  string id = 3;
}
message ReferenceGain {
  string owning_card_id = 1;
  float gain = 2;
}
message ReferenceAutomaticGainControl {
  string owning_card_id = 1;
  bool automatic_gain_control = 2;
}
message OnboardMicTest {
  enum State {
    INVALID_STATE = 0;
    READY_FOR_RECORD = 1;
    RECORDING = 2;
    READY_FOR_PLAYBACK = 3;
    PLAYING = 4;
    ERASING = 5;
    NOT_CONNECTED = 6;
    HOST_RECORDING = 7;
    READY_FOR_HOST_PLAYBACK = 8;
    HOST_PLAYING = 9;
  }
  logi.protocol.microphone.OnboardMicTest.State state = 1;
}
message Meter {
  message Watch {
    string endpoint_id = 1;
    bool input_enabled = 2;
    bool output_enabled = 3;
    bool gating_gain_enabled = 4;
    bool compressor_gain_enabled = 5;
    bool limiter_input_enabled = 6;
    bool limiter_output_enabled = 7;
    bool expander_gain_enabled = 8;
    bool deesser_gain_enabled = 9;
    bool depopper_gain_enabled = 10;
    bool denoiser_noise_enabled = 11;
    bool pre_compressor_meter_enabled = 12;
    bool post_compressor_meter_enabled = 13;
    bool pre_compressor_histogram_enabled = 14;
    bool post_compressor_histogram_enabled = 15;
  }
  message Data {
    enum Type {
      INVALID = 0;
      INPUT = 1;
      OUTPUT = 2;
      GATING_GAIN = 3;
      COMPRESSOR_GAIN = 4;
      LIMITER_INPUT = 5;
      LIMITER_OUTPUT = 6;
      EXPANDER_GAIN = 7;
      DEESSER_GAIN = 8;
      DEPOPPER_GAIN = 9;
      DENOISER_NOISE = 10;
      PRE_COMPRESSOR_METER = 11;
      POST_COMPRESSOR_METER = 12;
      PRE_COMPRESSOR_HISTOGRAM = 13;
      POST_COMPRESSOR_HISTOGRAM = 14;
    }
    logi.protocol.microphone.Meter.Data.Type type = 1;
    float average = 2;
    float peak = 3;
  }
  message Range {
    logi.protocol.microphone.Meter.Data.Type Type = 1;
    float min = 2;
    float max = 3;
    float warn_level = 4;
    float alert_level = 5;
  }
  message Info {
    repeated logi.protocol.microphone.Meter.Range ranges = 1;
  }
  string endpoint_id = 1;
  bool enabled = 2;
}
