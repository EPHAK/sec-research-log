syntax = "proto3";
package logi.protocol.overwolf;

enum ExtensionType {
  INVALID = 0;
  GAME_CAPTURE = 1;
  TWITCH = 2;
  REPLAY_HUD = 3;
}
enum ExtensionState {
  INVALID_STATE = 0;
  INSTALLED = 1;
  NOT_INSTALLED = 2;
}
message Extensions {
  message Extension {
    logi.protocol.overwolf.ExtensionType id = 1;
    string name = 2;
    logi.protocol.overwolf.ExtensionState state = 3;
  }
  message Install {
    logi.protocol.overwolf.ExtensionType id = 1;
  }
  repeated logi.protocol.overwolf.Extensions.Extension extensions = 1;
}
message OverwolfState {
  bool installed = 1;
}
