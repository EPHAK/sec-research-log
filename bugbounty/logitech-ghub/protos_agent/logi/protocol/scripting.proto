syntax = "proto3";
package logi.protocol.scripting;

enum Language {
  INVALID = 0;
  LUA = 1;
}
enum MouseButton {
  UNKNOWN_MouseButton = 0;
  LeftButton = 1;
  RightButton = 2;
  MidButton = 3;
  XButton1 = 4;
  XButton2 = 5;
}
message ScriptSettings {
  message Lua {
    bool view_line_numbers = 1;
    bool view_output = 2;
    bool view_highlighting = 3;
  }
}
message ScriptDocumentation {
  logi.protocol.scripting.Language language = 1;
  string url = 2;
  string local_path = 3;
}
message Script {
  string name = 1;
  string description = 2;
  string file_name = 3;
}
message ScriptContent {
  string script_id = 1;
  string content = 2;
}
message Scripts {
  map<string, logi.protocol.scripting.Script> scripts = 1;
}
message ScriptName {
  string script_id = 1;
  string name = 2;
}
message ScriptDescription {
  string script_id = 1;
  string description = 2;
}
message ScriptID {
  string script_id = 1;
}
message ScriptNew {
  string name = 1;
  string description = 2;
  string profile_id = 3;
}
message ScriptDuplicate {
  string script_id = 1;
  string profile_id = 2;
}
message ScriptOutput {
  enum Status {
    INVALID = 0;
    LOADED = 1;
    SYNTAX_ERROR = 2;
    RUNTIME_ERROR = 3;
    LOG_MESSAGE = 4;
    CLEAR_LOG = 5;
  }
  logi.protocol.scripting.ScriptOutput.Status status = 1;
  string message = 2;
  int32 line_number = 3;
  string timestamp = 4;
}
message ScriptEditorState {
  enum State {
    INVALID = 0;
    OPEN = 1;
    CLOSED = 2;
  }
  logi.protocol.scripting.ScriptEditorState.State state = 1;
}
