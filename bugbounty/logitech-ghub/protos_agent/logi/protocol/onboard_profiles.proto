syntax = "proto3";
package logi.protocol.onboard_profiles;
import "logi/protocol/bunny_hopping.proto";
import "logi/protocol/mouse.proto";
import "logi/protocol/macros.proto";
import "logi/protocol/firmware_lighting.proto";
import "logi/protocol/input_preset.proto";
import "logi/common_protocol/util.proto";
import "logi/protocol/report_rates.proto";
import "logi/protocol/scroll_wheel.proto";

message Info {
  enum ProfileID {
    PROFILE_UNKNOWN = 0;
    PROFILE_1 = 1;
    PROFILE_2 = 2;
    PROFILE_3 = 3;
    PROFILE_4 = 4;
    PROFILE_5 = 5;
    PROFILE_ROM_1 = 6;
    PROFILE_ROM_2 = 7;
    PROFILE_ROM_3 = 8;
    PROFILE_ROM_4 = 9;
    PROFILE_ROM_5 = 10;
    PROFILE_ALL = 11;
    PROFILE_CURRENT = 12;
  }
  repeated logi.protocol.onboard_profiles.Info.ProfileID profile_ids = 2;
}
message ProfileDirectory {
  message Entry {
    logi.protocol.onboard_profiles.Info.ProfileID onboard_slot_id = 1;
    bool enabled = 2;
    string name = 3;
    logi.protocol.mouse.Settings mouse_settings = 4;
    logi.protocol.util.Enable angle_snapping = 5;
    logi.protocol.firmware_lighting.Effects lighting = 6;
    repeated logi.protocol.onboard_profiles.MacroMapping button_mappings = 7;
    repeated logi.protocol.onboard_profiles.MacroMapping gshift_mappings = 8;
    map<uint32, logi.protocol.onboard_profiles.LayerRemapping> layer_remappings = 9;
    repeated uint32 game_mode_keys = 10;
    logi.protocol.onboard_profiles.AnalogSettings analog_settings = 11;
    logi.protocol.bunny_hopping.BunnyHopping bunny_hopping = 12;
    logi.protocol.report_rates.ReportRate report_rate = 13;
    logi.protocol.scroll_wheel.ScrollWheelPreset scroll_wheel = 14;
  }
  repeated logi.protocol.onboard_profiles.ProfileDirectory.Entry directory_entries = 1;
  logi.protocol.onboard_profiles.Info.ProfileID active_profile = 2;
  uint32 maximum_storage = 3;
  uint32 used_storage = 4;
}
message MacroMapping {
  uint32 button = 1;
  logi.protocol.macros.Macro macro = 2;
}
message ProfileSlot {
  string profile_id = 1;
  logi.protocol.onboard_profiles.Info.ProfileID onboard_slot_id = 2;
}
message OnboardMode {
  enum Mode {
    INVALID = 0;
    HOST = 1;
    ONBOARD = 2;
  }
  logi.protocol.onboard_profiles.OnboardMode.Mode mode = 1;
}
message LayerRemapping {
  message Action {
    uint32 modifier = 1;
    logi.protocol.macros.Macro macro = 2;
  }
  message Remappings {
    uint32 cid = 1;
    repeated logi.protocol.onboard_profiles.LayerRemapping.Action actions = 2;
  }
  logi.protocol.input_preset.Input.Layer layer = 1;
  map<uint32, logi.protocol.onboard_profiles.LayerRemapping.Remappings> remappings = 2;
}
message AnalogSettings {
  bool rapid_trigger_enabled = 1;
  uint32 actuation_point_keys_count = 2;
  uint32 rapid_trigger_keys_count = 3;
  uint32 binding_feature_keys_count = 4;
  uint32 multi_action_keys_count = 5;
  map<uint32, float> actuation_point_values = 6;
  map<uint32, float> rapid_trigger_values = 7;
  map<uint32, float> click_haptics_values = 8;
  repeated uint32 rapid_trigger_explicit_states = 9;
}
