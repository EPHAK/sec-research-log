syntax = "proto3";
package logi.protocol.illumination_light;
import "logi/common_protocol/util.proto";

message ColorRange {
  logi.protocol.util.RangeUInt color_temperature_range = 1;
  logi.protocol.util.RangeUInt brightness_range = 2;
  repeated uint32 brightness_non_linear_levels = 3;
  repeated uint32 color_temperature_non_linear_levels = 4;
  uint32 brightness_effective_max = 5;
}
message Color {
  message Description {
    string slot_prefix = 1;
  }
  uint32 temperature = 1;
  uint32 brightness = 2;
  logi.protocol.illumination_light.Color.Description description = 3;
  bool manual_card = 4;
}
message Power {
  bool on = 1;
}
message Media {
  string device_id = 1;
  bool webcam_sync = 2;
}
