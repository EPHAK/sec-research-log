syntax = "proto3";
package logi.protocol.cards;
import "logi/protocol/audio.proto";
import "logi/protocol/axis_response_curve.proto";
import "logi/protocol/bunny_hopping.proto";
import "logi/protocol/firmware_lighting.proto";
import "logi/protocol/illumination_light.proto";
import "logi/protocol/input_preset.proto";
import "logi/protocol/iprofile.proto";
import "logi/protocol/keyboard.proto";
import "logi/protocol/macros.proto";
import "logi/protocol/microphone.proto";
import "logi/protocol/mouse.proto";
import "logi/protocol/pedals.proto";
import "logi/protocol/rpm_indicator.proto";
import "logi/protocol/software_lighting.proto";
import "logi/protocol/webcam.proto";
import "logi/protocol/wheel.proto";
import "logi/protocol/lighting.proto";
import "logi/protocol/analog_preset.proto";
import "logi/protocol/rs_shifter_handbrake.proto";
import "logi/protocol/report_rates.proto";
import "logi/protocol/scroll_wheel.proto";

message Card {
  enum Attribute {
    INVALID = 0;
    MACRO_PLAYBACK = 1;
    ACOUSTICS = 2;
    EQUALIZER = 3;
    MOUSE_SETTINGS = 4;
    DISABLE_KEY_SETTINGS = 5;
    FIRMWARE_LIGHTING_SETTINGS = 6;
    SOFTWARE_LIGHTING_SETTINGS = 7;
    SYNC_LIGHTING_SETTINGS = 8;
    CAMERA_SETTINGS = 9;
    VIDEO_SETTINGS = 10;
    WHEEL_SETTINGS = 11;
    PEDAL_SETTINGS = 12;
    PRO_EQUALIZER = 13;
    MICROPHONE_SETTINGS = 14;
    BLUE_VOICE_SETTINGS = 15;
    TRUEFORCE_SETTINGS = 16;
    BLUE_VOICE_2_SETTINGS = 17;
    AUDIO_EFFECTS_SETTINGS = 18;
    ILLUMINATION_LIGHT_POWER_SETTINGS = 20;
    ILLUMINATION_LIGHT_COLOR_SETTINGS = 21;
    ILLUMINATION_LIGHT_MEDIA_SETTINGS = 22;
    CENTURION_EQUALIZER = 23;
    PADDLES_SETTINGS = 25;
    RPM_PATTERN_SETTINGS = 26;
    MOUSE_SETTINGS_ADVANCED = 27;
    CENTURION_PRO_EQ = 28;
    MOUSE_SENSITIVITY = 29;
    INPUT_PRESET = 30;
    INPUT_CONFIGURATION = 31;
    DISABLE_CONTROLS = 32;
    AUDIO_MIXING_MATRIX_SETTINGS = 33;
    UNIFIED_EQUALIZER_PRESET = 34;
    CENTURION_MIXER_MIC = 35;
    DISABLE_CONTROLS_PRESET = 36;
    REFERENCE_GAIN = 37;
    REFERENCE_AUTOMATIC_GAIN_CONTROL = 38;
    LIGHTING_SETTINGS = 39;
    FOCUS_SETTINGS = 40;
    IMAGE_SETTINGS = 41;
    CROP_SETTINGS = 42;
    EXPOSURE_SETTINGS = 43;
    ANALOG_PRESET = 44;
    ANALOG_CONFIGURATION = 45;
    WEBCAM_MICROPHONE_SETTINGS = 46;
    LOGIVOICE_PRESET = 47;
    RS_SHIFTER_HANDBRAKE_SETTINGS = 48;
    IPROFILE_SETTINGS = 49;
    BUNNY_HOPPING = 50;
    STANDALONE_REPORT_RATE = 51;
    AXIS_RESPONSE_CURVE_SETTINGS = 52;
    MICROPHONE_PRESET = 53;
    SCROLL_WHEEL_CONFIGURATION = 54;
    SCROLL_WHEEL_PRESET = 55;
    CAMERA_PRESET_SETTINGS = 56;
  }
  message Collection {
    message Update {
      repeated logi.protocol.cards.Card updated_cards = 1;
      repeated string removed_ids = 2;
      repeated string added_ids = 5;
      bool skip_apply = 6;
    }
    repeated logi.protocol.cards.Card cards = 1;
  }
  message List {
    repeated string ids = 1;
  }
  message Id {
    string id = 1;
  }
  message Filter {
    repeated string ids = 1;
    string profile_id = 2;
    string application_id = 3;
    string device_signature = 4;
    logi.protocol.cards.Card.Attribute attribute = 5;
  }
  message FilteredCollection {
    logi.protocol.cards.Card.Filter filter = 1;
    repeated logi.protocol.cards.Card cards = 2;
  }
  string id = 1;
  string name = 2;
  logi.protocol.cards.Card.Attribute attribute = 3;
  string category = 4;
  bool read_only = 5;
  string application_id = 10;
  string profile_id = 11;
  string device_signature = 12;
  logi.protocol.macros.Macro macro = 20;
  logi.protocol.audio.Acoustics acoustics = 21;
  logi.protocol.audio.Equalizer equalizer = 22;
  logi.protocol.mouse.Settings mouse_settings = 23;
  logi.protocol.keyboard.DisableKeys disable_keys_settings = 24;
  logi.protocol.firmware_lighting.CardSettings.Firmware firmware_lighting_settings = 25;
  logi.protocol.software_lighting.CardSettings software_lighting_settings = 26;
  logi.protocol.firmware_lighting.CardSettings.Sync sync_lighting_settings = 27;
  logi.protocol.webcam.Webcam.CameraSettings camera_settings = 28;
  logi.protocol.webcam.Webcam.VideoSettings video_settings = 29;
  logi.protocol.wheel.PaddlesSettings paddles_settings = 30;
  logi.protocol.wheel.WheelSettings wheel_settings = 31;
  logi.protocol.pedals.PedalSettings pedal_settings = 32;
  logi.protocol.rpm_indicator.RPMPatternSettings rpm_pattern_settings = 33;
  logi.protocol.wheel.TrueForceSettings trueforce_settings = 34;
  logi.protocol.audio.ProEqualizer pro_equalizer = 35;
  logi.protocol.microphone.Settings microphone_settings = 36;
  logi.protocol.microphone.BlueVoice blue_voice_settings = 37;
  logi.protocol.microphone.BlueVoice2 blue_voice_2_settings = 38;
  logi.protocol.microphone.Effects audio_effects_settings = 39;
  logi.protocol.illumination_light.Power illumination_light_power_settings = 41;
  logi.protocol.illumination_light.Color illumination_light_color_settings = 42;
  logi.protocol.illumination_light.Media illumination_light_media_settings = 43;
  logi.protocol.audio.CenturionEqualizer centurion_equalizer = 44;
  logi.protocol.audio.CenturionProEQ centurion_pro_equalizer = 46;
  logi.protocol.mouse.Sensitivity mouse_sensitivity = 47;
  logi.protocol.input_preset.InputPreset input_preset = 48;
  logi.protocol.input_preset.InputPreset.Configuration input_configuration = 49;
  logi.protocol.keyboard.DisableControls disable_control_settings = 50;
  logi.protocol.audio.MixingMatrix audio_mixer_settings = 51;
  logi.protocol.audio.UnifiedEqualizer unified_equalizer_preset = 52;
  logi.protocol.audio.MixerMic centurion_mixer_mic = 53;
  logi.protocol.keyboard.DisableControlsPreset disable_controls_preset = 54;
  logi.protocol.microphone.ReferenceGain reference_gain = 55;
  logi.protocol.microphone.ReferenceAutomaticGainControl reference_automatic_gain_control = 56;
  logi.protocol.lighting.CardSettings lighting_settings = 57;
  logi.protocol.webcam.Webcam.FocusSettings focus_settings = 58;
  logi.protocol.webcam.Webcam.ImageSettings image_settings = 59;
  logi.protocol.webcam.Webcam.CropSettings crop_settings = 60;
  logi.protocol.webcam.Webcam.ExposureSettings exposure_settings = 61;
  logi.protocol.analog_preset.AnalogPreset analog_preset = 62;
  logi.protocol.analog_preset.AnalogPreset.Configuration analog_configuration = 63;
  logi.protocol.webcam.Webcam.MicrophoneSettings webcam_microphone_settings = 64;
  logi.protocol.audio.Logivoice.Parameters logivoice_preset = 65;
  logi.protocol.rs_shifter_handbrake.Settings rs_shifter_handbrake_settings = 66;
  logi.protocol.iprofile.Data iprofile_settings = 67;
  logi.protocol.bunny_hopping.BunnyHopping bunny_hopping = 68;
  logi.protocol.report_rates.ReportRate report_rate = 69;
  logi.protocol.axis_response_curve.EditorSettings arc_settings = 70;
  logi.protocol.audio.MicrophonePreset microphone_preset = 71;
  logi.protocol.scroll_wheel.ScrollWheelConfiguration scroll_wheel_configuration = 72;
  logi.protocol.scroll_wheel.ScrollWheelPreset scroll_wheel_preset = 73;
  logi.protocol.webcam.Webcam.CameraPresetSettings camera_preset_settings = 74;
}
