syntax = "proto3";
package logi.protocol.surface_tuning;

message Surface {
  enum Type {
    INVALID = 0;
    PRESET_FACTORY = 1;
    PRESET_HARD = 2;
    PRESET_SOFT = 3;
    CUSTOM = 4;
  }
  string uid = 1;
  logi.protocol.surface_tuning.Surface.Type type = 2;
  string name = 3;
  bool tuned = 4;
  bool active = 5;
}
message Surfaces {
  repeated logi.protocol.surface_tuning.Surface surfaces = 1;
  double min_speed = 2;
  double max_speed = 3;
}
message Speed {
  enum Suggestion {
    INVALID = 0;
    GOOD = 1;
    SLOWER = 2;
    FASTER = 3;
  }
  double current = 1;
  logi.protocol.surface_tuning.Speed.Suggestion suggestion = 2;
}
message Event {
  enum State {
    INVALID = 0;
    TUNING = 1;
    SUCCESS = 2;
    ABORTED = 3;
    FAILED = 4;
  }
  string uid = 1;
  logi.protocol.surface_tuning.Event.State state = 2;
  logi.protocol.surface_tuning.Speed speed = 3;
  double progress = 4;
}
