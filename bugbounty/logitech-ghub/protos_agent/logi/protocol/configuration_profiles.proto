syntax = "proto3";
package logi.protocol.configation_profiles;
import "logi/protocol/cards.proto";

message ConfigurationProfile {
  uint32 index = 1;
  string name = 2;
}
message ConfigurationProfiles {
  repeated logi.protocol.configation_profiles.ConfigurationProfile profiles = 1;
}
message ConfigurationProfileInfo {
  uint32 profiles_count = 1;
  uint32 max_name_length = 2;
  uint32 active_profile = 3;
  bool has_sw_control = 4;
  repeated logi.protocol.configation_profiles.ConfigurationProfile profiles = 5;
}
message ConfigurationProfileCard {
  uint32 profile_index = 1;
  logi.protocol.cards.Card card = 2;
}
