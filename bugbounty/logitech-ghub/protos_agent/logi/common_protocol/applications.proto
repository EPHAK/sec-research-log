syntax = "proto3";
package logi.protocol.applications;
import "logi/common_protocol/util.proto";

message Command {
  string name = 1;
  string category = 2;
  string card_id = 3;
}
message Application {
  message Game {
    message Steam {
      string id = 1;
    }
    message Blizzard {
      string id = 1;
    }
    message Origin {
      string id = 1;
    }
    message Uplay {
      string id = 1;
    }
    message Epic {
      string id = 1;
    }
    message Other {
      string id = 1;
    }
    logi.protocol.applications.Application.Game.Other other = 1;
    logi.protocol.applications.Application.Game.Steam steam = 2;
    logi.protocol.applications.Application.Game.Blizzard blizzard = 3;
    logi.protocol.applications.Application.Game.Origin origin = 4;
    logi.protocol.applications.Application.Game.Uplay uplay = 5;
    logi.protocol.applications.Application.Game.Epic epic = 6;
  }
  string database_id = 1;
  string name = 2;
  string bundle_id = 3;
  uint32 version = 4;
  string install_time = 5;
  string last_run_time = 6;
  string application_path = 7;
  string application_folder = 8;
  logi.protocol.applications.Application.Game game = 9;
  bytes poster = 10;
  bytes background = 11;
  bytes theme_music = 12;
  uint32 process_id = 13;
  uint32 session_id = 14;
  string command_line = 15;
  string application_id = 16;
  repeated logi.protocol.applications.Command commands = 17;
  repeated logi.protocol.util.Color category_colors = 18;
  bool is_custom = 19;
  string poster_url = 20;
  string poster_title_position = 21;
  bool is_disabled = 22;
  bool is_installed = 23;
  repeated string user_paths = 24;
  string poster_path = 25;
}
message Event {
  enum Type {
    INVALID = 0;
    APPLICATION_START = 1;
    APPLICATION_STOP = 2;
    APPLICATION_FOCUS = 3;
    APPLICATION_DISCOVERED = 4;
    SCAN_START = 5;
    SCAN_STOP = 6;
  }
  logi.protocol.applications.Event.Type type = 1;
  logi.protocol.applications.Application application = 2;
  string time = 3;
  string session_time = 4;
}
message Applications {
  repeated logi.protocol.applications.Application applications = 1;
}
message ApplicationId {
  message List {
    repeated string application_ids = 1;
  }
  string application_id = 1;
}
message ApplicationInfo {
  string application_id = 1;
  string name = 2;
  string poster_url = 3;
  string poster_title_position = 4;
}
message ApplicationInfos {
  repeated logi.protocol.applications.ApplicationInfo application_infos = 1;
}
message ScannedApplicationInfo {
  string application_id = 1;
  string name = 2;
  string poster_url = 3;
  string poster_title_position = 4;
  string detected_time = 5;
}
message ScannedApplicationInfoList {
  repeated logi.protocol.applications.ScannedApplicationInfo application_infos = 1;
}
message ScannedApplicationStatus {
  string detected_time = 1;
}
message ScannedApplicationsStatus {
  map<string, logi.protocol.applications.ScannedApplicationStatus> scanned_applications_status = 1;
}
