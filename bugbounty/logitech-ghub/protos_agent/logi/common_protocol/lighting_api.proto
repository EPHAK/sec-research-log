syntax = "proto3";
package logi.protocol.lighting.api;
import "logi/common_protocol/message.proto";
import "logi/common_protocol/integrations.proto";
import "logi/common_protocol/lighting_support.proto";
import "logi/common_protocol/util.proto";

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 build = 3;
}
message Target {
  enum Type {
    INVALID = 0;
    MONOCHROME = 1;
    RGB = 2;
    RGB_PER_KEY = 3;
  }
  repeated logi.protocol.lighting.api.Target.Type types = 1;
}
message GlobalColor {
  repeated logi.protocol.lighting.api.Target.Type lighting_types = 1;
  logi.protocol.util.Color color = 2;
}
message Key {
  enum Type {
    INVALID = 0;
    HID_USAGE = 1;
    SCAN_CODE = 2;
    QUARTZ_CODE = 3;
    API_NAME = 4;
  }
  message Group {
    logi.protocol.lighting.api.Key.Type key_type = 1;
    repeated logi.protocol.lighting.api.Key keys = 2;
  }
  logi.protocol.util.Color color = 1;
  uint32 code = 2;
}
message SaveRestore {
  enum OperationType {
    INVALID = 0;
    SAVE = 1;
    RESTORE = 2;
  }
  message Targets {
    logi.protocol.lighting.api.SaveRestore.OperationType operation = 1;
    repeated logi.protocol.lighting.api.Target.Type target_types = 2;
  }
  message IndividualKeys {
    logi.protocol.lighting.api.SaveRestore.OperationType operation = 1;
    logi.protocol.lighting.api.Key.Group target_keys = 2;
  }
}
message Zone {
  message Color {
    logi.protocol.lighting_support.Zone.Type zone_type = 1;
    logi.protocol.util.Color zone_color = 2;
  }
  message Target {
    logi.protocol.lighting_support.Device.Type device_type = 1;
    logi.protocol.lighting.api.Target.Type lighting_type = 2;
    repeated logi.protocol.lighting.api.Zone.Color zone_colors = 3;
  }
}
message Bitmap {
  message Color {
    repeated logi.protocol.util.Color values = 1;
  }
  repeated uint32 bgra = 2;
  logi.protocol.lighting.api.Key.Group exclude = 3;
}
message QueuedMessage {
  logi.protocol.Message.Verb message_verb = 1;
  logi.protocol.lighting.api.SaveRestore.Targets save_restore_message = 2;
  logi.protocol.lighting.api.SaveRestore.IndividualKeys save_restore_keys_message = 3;
  logi.protocol.lighting.api.GlobalColor global_color_message = 4;
  logi.protocol.lighting.api.Zone.Target target_zone_colors = 5;
  logi.protocol.lighting.api.Bitmap bitmap_message = 6;
  logi.protocol.lighting.api.Key.Group key_colors_message = 7;
  logi.protocol.integrations.SDKConfigOption config_option = 8;
}
message MasterUpdateMessage {
  logi.protocol.integrations.InstanceInfo instance = 1;
  repeated logi.protocol.lighting.api.QueuedMessage queue = 2;
}
