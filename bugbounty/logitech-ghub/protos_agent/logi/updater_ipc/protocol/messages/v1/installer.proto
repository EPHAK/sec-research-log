syntax = "proto3";
package logi.updater_ipc.protocol.v1.installer.protobuf;

enum LaunchableOperation {
  INVALID = 0;
  INSTALL = 1;
  UPDATE = 2;
  RESTART = 3;
}
message DepotExtensions {
  message DepotExecutable {
    string pipeline_uri = 1;
    repeated string arguments = 2;
  }
  message Extension {
    string name = 1;
    string version = 2;
    bool auto_install = 3;
    logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.DepotExecutable installer = 4;
    logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.DepotExecutable uninstaller = 5;
  }
  message ExtensionState {
    enum State {
      INVALID_EXTENSION_STATE = 0;
      EXTENSION_UNINSTALLING = 1;
      EXTENSION_UNINSTALLED = 2;
      EXTENSION_UNINSTALL_ERROR = 3;
      EXTENSION_INSTALLING = 4;
      EXTENSION_INSTALLED = 5;
      EXTENSION_INSTALL_ERROR = 6;
      EXTENSION_TO_REINSTALL = 7;
      NO_SUCH_EXTENSION = 8;
    }
    logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.ExtensionState.State state = 1;
    string error = 2;
  }
  message DepotExtension {
    string depot_name = 1;
    string extension_name = 2;
    logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.ExtensionState state = 3;
  }
  message ExtensionInstall {
    logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.Extension extension = 1;
    logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.ExtensionState state = 2;
  }
  message ExtensionInstalls {
    repeated logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.ExtensionInstall extensions = 1;
  }
}
message Request {
  string app_tag = 1;
}
message InstallDepotRequest {
  string app_tag = 1;
  string depot_name = 2;
  string build_id = 3;
  logi.updater_ipc.protocol.v1.installer.protobuf.LaunchableOperation op = 4;
  map<string, string> custom_tags = 5;
  repeated string file_groups = 6;
}
message InstallDepotResponse {
  bool success = 1;
}
message UninstallDepotRequest {
  string app_tag = 1;
  string depot_name = 2;
  string build_id = 3;
}
message UninstallDepotResponse {
  bool success = 1;
}
message InstallDepotExtensionRequest {
  string app_tag = 1;
  string depot_name = 2;
  string extension_name = 3;
}
message UninstallDepotExtensionRequest {
  string app_tag = 1;
  string depot_name = 2;
  string extension_name = 3;
}
message WaitAndKillProcessesResponse {
  bool success = 1;
}
message StartProcessesRequest {
  string app_tag = 1;
  logi.updater_ipc.protocol.v1.installer.protobuf.LaunchableOperation op = 2;
  bool frontend_only = 3;
}
message CheckForRebootResponse {
  bool needs_reboot = 1;
}
message GetDepotExtensionStateRequest {
  string app_tag = 1;
  string depot_name = 2;
  string extension_name = 3;
}
message GetDepotExtensionStateResponse {
  logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.ExtensionState state = 1;
}
message DepotInstallStateEvent {
  string app_tag = 1;
  logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.DepotExtension state = 2;
}
message GetDepotExtensionsRequest {
  string app_tag = 1;
  string depot_name = 2;
  string build_id = 3;
}
message GetDepotExtensionsResponse {
  logi.updater_ipc.protocol.v1.installer.protobuf.DepotExtensions.ExtensionInstalls extensions = 1;
}
message RunLaunchableByAliasRequest {
  string app_tag = 1;
  string depot_name = 2;
  string launchable_alias = 3;
  bool wait = 4;
}
message RunLaunchableByAliasResponse {
  bool success = 1;
  int32 exit_code = 2;
  string error = 3;
}
