syntax = "proto3";
package logi.protocol.wheel;
import "logi/protocol/axis.proto";
import "logi/protocol/rpm_indicator.proto";
import "logi/common_protocol/util.proto";

message FfbFilter {
  bool filter_enabled = 1;
  bool auto_mode_available = 2;
  bool auto_mode_enabled = 3;
  logi.protocol.util.RangeInt filter_value = 4;
}
message PaddlesSettings {
  logi.protocol.axis.Id left_paddle_index = 1;
  logi.protocol.axis.Id left_paddle_report_index = 2;
  logi.protocol.axis.Id right_paddle_index = 3;
  logi.protocol.axis.Id right_paddle_report_index = 4;
  int32 bite_point = 5;
  bool use_combined_pedals = 6;
}
message WheelSettings {
  logi.protocol.util.RangeInt wheel_aperture = 1;
  logi.protocol.util.RangeInt wheel_sensitivity = 2;
  logi.protocol.util.RangeInt center_spring_strength = 3;
  bool use_center_spring_strength = 4;
  logi.protocol.util.RangeInt wheel_damping = 5;
  logi.protocol.util.RangeFloat torque_limit = 6;
  logi.protocol.wheel.FfbFilter ffb_filter = 7;
  uint32 flags = 8;
  string wheel_sensitivity_preset = 9;
}
message TrueForceSettings {
  string device_id = 1;
  logi.protocol.util.Number tf_gain = 2;
  logi.protocol.util.Number kf_gain = 3;
  logi.protocol.util.Enable game_control = 4;
}
message DualClutch {
  bool enabled = 1;
  logi.protocol.util.RangeInt bite_point = 2;
  bool inverted = 3;
}
message OnboardRPMPatterns {
  uint32 count = 1;
  repeated logi.protocol.util.Color default_colors = 2;
  repeated logi.protocol.rpm_indicator.RpmLedPattern default_onboard_effects = 3;
}
message CenterPositionCalibration {
  bool restricted = 1;
  uint32 deviation = 2;
}
message Capabilities {
  logi.protocol.wheel.CenterPositionCalibration center_position = 1;
}
message OperatingRange {
  int32 minimum = 1;
  int32 maximum = 2;
  int32 step = 3;
}
message Aperture {
  string device_id = 1;
  int32 degrees = 2;
}
