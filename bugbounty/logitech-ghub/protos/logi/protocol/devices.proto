message Device {
  enum DisplayConnection {
    INVALID_DISPLAY_CONNECTION = 0;
    VIRTUAL = 1;
    ACCESSORY = 2;
    USB = 3;
    WIRELESS = 4;
    LIGHTSPEED = 5;
    BLUETOOTH = 6;
    BLE = 7;
  }
  enum Type {
    INVALID_TYPE = 0;
    KEYBOARD = 1;
    MOUSE = 2;
    HEADSET = 3;
    STEERING_WHEEL = 4;
    PEDALS = 5;
    HID_DEVICE = 6;
    CHARGE_PAD = 7;
    SPEAKER = 8;
    CAMERA = 9;
    MICROPHONE = 10;
    ILLUMINATION_LIGHT = 11;
    EARBUDS = 12;
    ADAPTER = 13;
    COMBO = 14;
    RS_SHIFTER_HANDBRAKE = 15;
    H_SHIFTER = 16;
    AUDIO_BASE_STATION = 17;
  }
  enum State {
    INVALID_STATE = 0;
    ABSENT = 1;
    PRESENT = 2;
    NOT_CONNECTED = 3;
    PENDING = 4;
    LOADING_RESOURCES = 5;
    REQUIRES_ASSISTANCE = 6;
    BLOCKED = 7;
    REQUIRES_UPDATE = 8;
    INITIALIZING = 9;
    ACTIVE = 10;
  }
  message Interface {
    enum Type {
      INVALID_TYPE = 0;
      DEVIO = 1;
      HIDIO = 2;
      UVC = 3;
      AUDIO = 4;
    }
    enum Connection {
      INVALID_CONNECTION = 0;
      VIRTUAL = 1;
      ACCESSORY = 2;
      USB = 3;
      WIRELESS = 4;
      BLUETOOTH = 5;
      BLE = 6;
    }
    message Status {
      bool has_features = 1;
      bool connected = 2;
      bool is_bootloader = 3;
      bool blocked = 4;
      bool ready = 5;
      bool active = 6;
    }
    message Firmware_Info {
      string interface_id = 1;
      string firmware_version = 2;
      string firmware_name = 3;
      string firmware_friendly_name = 4;
      uint32 firmware_revision = 5;
      uint32 hardware_revision = 6;
    }
    message Data {
      logi.protocol.devices.Device.Interface.Type type = 1;
      string id = 2;
      uint32 pid = 3;
      uint32 model_id = 4;
      uint32 extended_model = 5;
      string serial_number = 6;
      string path = 7;
      string container_id = 8;
      logi.protocol.devices.Device.Type device_type = 9;
      string device_name = 10;
      logi.protocol.keyboard.Keyboard.Layout keyboard_layout = 11;
      string firmware_version = 12;
      string firmware_name = 13;
      uint32 firmware_revision = 14;
      uint32 hardware_revision = 15;
      string unit_id = 16;
      logi.protocol.devices.Subdevice.Identifier subdevice = 17;
      logi.protocol.devices.SubComponent.Info subcomponent = 18;
      map<string, string> fw_entities = 19;
      logi.protocol.devices.Device.Interface.Connection connection_type = 20;
      bool has_onboard_mode = 30;
      string parent_path = 31;
      string hashed_serial_number = 32;
      string hashed_unit_id = 33;
    }
    message State {
      message List {
        logi.protocol.devices.Device.Info.Basic basic_info = 1;
        repeated logi.protocol.devices.Device.Interface.State interface_states = 2;
      }
      logi.protocol.devices.Device.Interface.Status status = 1;
      logi.protocol.devices.Device.Interface.Data data = 2;
    }
  }
  message Info {
    message Basic {
      string id = 1;
      logi.protocol.devices.Device.Type device_type = 2;
      string device_model = 3;
      string slot_prefix = 4;
      uint32 pid = 5;
      string device_signature = 6;
      bool supports_individuality = 7;
      bool individual_mode = 8;
      bool onboard_mode = 9;
      string parent_id = 10;
      logi.protocol.slots.Slot.Format default_slot_format = 11;
      bool is_subdevice = 12;
    }
    message List {
      repeated logi.protocol.devices.Device.Info device_infos = 1;
    }
    message ContainerId {
      logi.protocol.devices.Device.Info.Basic device_info = 1;
      string container_id = 2;
    }
    string id = 1;
    uint32 pid = 2;
    repeated logi.protocol.devices.Device.Interface.Firmware_Info fw_info = 3;
    bool is_subdevice = 4;
    string parent_id = 5;
    logi.protocol.devices.Device.State state = 6;
    bool onboard_mode = 7;
    bool individual_mode = 8;
    bool resources_available = 9;
    logi.protocol.devices.Device.Interface.Connection connection_type = 11;
    bool has_wireless_interface = 12;
    logi.protocol.devices.Device.DisplayConnection display_connection_type = 13;
    logi.protocol.devices.Device.Type device_type = 20;
    string device_family = 21;
    string device_model = 22;
    string device_base_model = 23;
    string display_name = 24;
    string extended_display_name = 25;
    string slot_prefix = 26;
    string thumbnail = 27;
    string string_package = 28;
    logi.protocol.devices.AssetsPackages assets_packages = 29;
    uint32 device_ext = 30;
    string device_unit_id = 31;
    string device_signature = 32;
    string given_name = 40;
    logi.protocol.devices.Capabilities capabilities = 50;
    repeated logi.protocol.devices.Device.Interface.Data active_interfaces = 60;
    map<string, logi.protocol.slots.Slot> slots = 61;
    map<string, logi.protocol.unified_profiles.Configuration.Header> configurations = 62;
    string path = 70;
    string parent_path = 71;
  }
  message Known {
    message List {
      repeated logi.protocol.devices.Device.Known known_list = 1;
    }
    string model_id = 1;
    logi.protocol.devices.Device.Type type = 2;
    uint32 device_ext = 3;
    string serial_number = 4;
    uint64 timestamp = 5;
    string signature = 6;
    bool reported_to_analytics = 7;
    string base_model_id = 8;
    uint64 first_seen_timestamp = 9;
  }
}
message Receiver {
  enum State {
    INVALID_STATE = 0;
    ABSENT = 1;
    PRESENT = 2;
    PENDING = 3;
    LOADING_RESOURCES = 4;
    REQUIRES_UPDATE = 5;
    INITIALIZING = 6;
    ACTIVE = 7;
  }
  enum Type {
    INVALID_TYPE = 0;
    LEGACY = 1;
    LS1 = 2;
    LS2 = 3;
    LS_HYBRID = 4;
    LSX = 5;
  }
  message Interface {
    enum Type {
      INVALID_TYPE = 0;
      DEVIO = 1;
      HIDIO = 2;
      AUDIO = 3;
    }
    message Status {
      bool has_features = 1;
      bool has_devices = 2;
      bool is_bootloader = 3;
      bool ready = 4;
      bool active = 5;
    }
    message Data {
      logi.protocol.devices.Receiver.Interface.Type type = 1;
      string id = 2;
      uint32 pid = 3;
      uint32 extended_model = 4;
      string serial_number = 5;
      string path = 6;
      string container_id = 7;
      string firmware_version = 8;
      uint32 pairing_slots = 9;
      map<string, string> fw_entities = 10;
    }
    message State {
      message List {
        logi.protocol.devices.Receiver.Info.Basic basic_info = 1;
        repeated logi.protocol.devices.Receiver.Interface.State interface_states = 2;
      }
      logi.protocol.devices.Receiver.Interface.Status status = 1;
      logi.protocol.devices.Receiver.Interface.Data data = 2;
    }
  }
  message Info {
    message Basic {
      string id = 1;
      logi.protocol.devices.Receiver.Type receiver_type = 2;
      logi.protocol.devices.Device.Type device_type = 3;
      string receiver_model = 4;
      uint32 pid = 5;
    }
    message List {
      repeated logi.protocol.devices.Receiver.Info receiver_infos = 1;
    }
    string id = 1;
    uint32 pid = 2;
    logi.protocol.devices.Receiver.State state = 3;
    uint32 pairing_slots = 4;
    logi.protocol.devices.Device.Type device_type = 5;
    logi.protocol.devices.Receiver.Type receiver_type = 20;
    string receiver_model = 21;
    string display_name = 22;
    logi.protocol.devices.Receiver.Metadata metadata = 30;
    repeated logi.protocol.devices.Receiver.Interface.Data active_interfaces = 40;
    map<uint32, string> paired_devices = 41;
    map<uint32, string> component_devices = 42;
  }
  message Metadata {
    bool restricted_devices = 1;
    bool is_chargepad = 2;
    bool supports_2khz = 3;
  }
}
message Blockers {
  message Blocker {
    enum Type {
      BLOCKER_NONE = 0;
      REQUIRES_REBOOT = 1;
      MISSING_DRIVER = 2;
      MISSING_APO = 3;
      DISABLED_APO = 4;
      DEVICE_DISABLED = 5;
      DEVICE_QUARANTINED = 6;
      MISSING_INTERFACE = 7;
      MULTIHOST_CONTROL = 8;
      ONBOARDING = 9;
      UNSUPPORTED_ARCH = 10;
      UNDETERMINED = -1;
    }
    logi.protocol.devices.Blockers.Blocker.Type type = 1;
    bool recoverable = 2;
  }
  message DeviceBlocker {
    string id = 1;
    logi.protocol.devices.Blockers.Blocker blocker = 2;
  }
  repeated logi.protocol.devices.Blockers.DeviceBlocker device_blockers = 1;
}
message Driver {
  enum Status {
    INVALID = 0;
    LOADED = 1;
    APPROVED = 2;
    BLOCKED = 3;
    REBOOT_NEEDED = 4;
    CONSENT_UNKNOWN = 5;
  }
  message Info {
    string id = 1;
    logi.protocol.devices.Driver driver = 2;
  }
  repeated string windows_ids = 1;
  repeated string osx_ids = 2;
  logi.protocol.devices.Driver.Status status = 3;
  logi.protocol.devices.Device.Interface.Type associated_interface_type = 4;
  bool associated_interface_ready = 5;
}
message CrossDeviceSupport {
  message ExtendedDisplayNames {
    repeated string extended_display_names = 1;
  }
  map<string, logi.protocol.devices.CrossDeviceSupport.ExtendedDisplayNames> use_presets_from = 1;
}
message DeviceImageOverlay {
  enum Category {
    CATEGORY_INVALID = 0;
    HEADBAND = 1;
  }
  message Skin {
    string display_name = 1;
    string resource_key = 2;
  }
  message LayerInfo {
    logi.protocol.devices.DeviceImageOverlay.Category category = 1;
    repeated logi.protocol.devices.DeviceImageOverlay.Skin skins = 2;
  }
  message info {
    repeated logi.protocol.devices.DeviceImageOverlay.LayerInfo layer_infos = 1;
  }
  message Setting {
    message LayerSetting {
      logi.protocol.devices.DeviceImageOverlay.Category category = 1;
      uint32 skin_index = 2;
