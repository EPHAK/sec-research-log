  bool sleep_timer = 3;
  logi.protocol.devices.Hidio hidio = 4;
  logi.protocol.devices.Capabilities.MState.Support mstate_support = 5;
  logi.protocol.devices.Capabilities.MaskedZones maskable_zones = 6;
  logi.protocol.devices.HidioControls report_hid_controls = 7;
