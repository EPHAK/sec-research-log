syntax = "proto3";
package logi.protocol.wireless;
import "logi/protocol/firmware_lighting.proto";
import "google/protobuf/timestamp.proto";
import "logi/protocol/mouse.proto";

message Capabilities {
  bool supports_2khz = 1;
  bool supports_bluetooth = 2;
  bool wireless_dfu = 3;
  bool bt_host_info = 4;
}
message Wireless {
  enum State {
    INVALID = 0;
    DISCONNECTED = 1;
    CONNECTED = 2;
    WIRED = 3;
  }
  enum BusType {
    UNKNOWN = 0;
    USB = 1;
    UNIIFYING = 2;
    BLUETOOTH = 3;
  }
  message ReportRate {
    repeated uint32 rate_list = 1;
    uint32 report_rate = 2;
  }
  logi.protocol.wireless.Wireless.State state = 1;
  logi.protocol.wireless.Wireless.BusType bus_type = 2;
}
message Power {
  message Consumption {
    message Brightness {
      bool supported = 1;
      uint32 value = 2;
    }
    message Update {
      logi.protocol.firmware_lighting.Effects lighting = 1;
      logi.protocol.wireless.Power.Consumption.Brightness brightness = 2;
      bool dpi_lighting_off = 3;
      int32 report_rate = 4;
      float audio_gain = 5;
      logi.protocol.mouse.ModeStatus.HybridType hybrid_type = 6;
      repeated int32 haptic_levels = 7;
    }
    message Details {
      float system = 1;
      float sensor = 2;
      float mcu = 3;
      float roller = 4;
      float report_rate = 5;
      float lighting = 6;
      float volume = 7;
      float haptics = 8;
    }
    float value = 1;
    logi.protocol.wireless.Power.Consumption.Details details = 2;
    bool use_mw = 3;
  }
}
message Battery {
  enum BatteryStateOfChargeSupport {
    STATE_OF_CHARGE_SUPPORTED = 0;
    STATE_OF_CHARGE_NOT_SUPPORTED = 1;
  }
  enum BatteryMileageSupport {
    MILEAGE_SUPPORTED = 0;
    MILEAGE_NOT_SUPPORTED = 1;
  }
  message Warning {
    enum Level {
      DEAD = 0;
      CRITICAL = 15;
      LOW = 30;
      GOOD = 50;
      GREAT = 90;
      FULL = 100;
    }
    string device_id = 1;
    float percentage = 2;
    uint64 time = 3;
    logi.protocol.wireless.Battery.Warning.Level level = 4;
    logi.protocol.wireless.MultiBatterySupport.ComponentType component_type = 5;
  }
  string device_id = 1;
  float percentage = 2;
  float mileage = 3;
  float max_life_span = 4;
  bool charging = 5;
  logi.protocol.wireless.Power.Consumption consumption = 6;
  logi.protocol.wireless.Battery.BatteryStateOfChargeSupport battery_state_of_charge_support = 7;
  bool critical_level = 8;
  bool charging_error = 9;
  logi.protocol.wireless.MultiBatterySupport.ComponentType component_type = 10;
  bool fully_charged = 11;
  bool is_battery_removed = 12;
  logi.protocol.wireless.Battery.BatteryMileageSupport battery_mileage_support = 13;
}
message BatteryCache {
  float percentage = 1;
  google.protobuf.Timestamp time = 2;
  float millivolts = 3;
  bool is_charging = 4;
}
message BatteryMaxMvCache {
  google.protobuf.Timestamp time = 1;
  float millivolts = 2;
}
message MultiBatterySupport {
  enum ComponentType {
    INVALID_TYPE = 0;
    CASE = 1;
    LEFT_EARBUD = 2;
    RIGHT_EARBUD = 3;
  }
  message Component {
    logi.protocol.wireless.MultiBatterySupport.ComponentType type = 1;
    uint32 id = 2;
    bool required_for_update = 3;
  }
  repeated logi.protocol.wireless.MultiBatterySupport.Component components = 1;
}
message BluetoothHost {
  message Info {
    string name = 1;
    bytes address = 2;
  }
  repeated logi.protocol.wireless.BluetoothHost.Info hosts = 1;
}
message BatteryEcoMode {
  enum State {
    INVALID_STATE = 0;
    DISABLED = 1;
    ENABLED = 2;
  }
  logi.protocol.wireless.BatteryEcoMode.State state = 1;
}
